apply plugin: 'com.android.library'

def blackBoxBooleanOption = { String name, boolean defaultValue ->
    if (project.hasProperty(name)) {
        return project.property(name).toString().toBoolean()
    }
    if (rootProject.hasProperty(name)) {
        return rootProject.property(name).toString().toBoolean()
    }
    if (rootProject.ext.has(name)) {
        return rootProject.ext.get(name).toString().toBoolean()
    }
    return defaultValue
}

def blackboxDiagnosticLogcatEnabledValue =
        blackBoxBooleanOption('blackboxDiagnosticLogcatEnabled', true)
def blackboxDexDumpEnabledValue =
        blackBoxBooleanOption('blackboxDexDumpEnabled', true)

android {
    namespace 'top.niunaijun.blackbox'
    compileSdk 28
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        minSdk 21
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        consumerProguardFiles "consumer-rules.pro"
        buildConfigField "boolean", "BLACKBOX_DIAGNOSTIC_LOGCAT_ENABLED",
                "${blackboxDiagnosticLogcatEnabledValue}"
        buildConfigField "boolean", "BLACKBOX_DEX_DUMP_ENABLED",
                "${blackboxDexDumpEnabledValue}"
        externalNativeBuild {
            cmake {
                arguments "-DBLACKBOX_DIAGNOSTIC_LOGCAT_ENABLED=${blackboxDiagnosticLogcatEnabledValue ? 1 : 0}"
            }
        }
        ndk {
            // 设置支持的SO库架构
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        aidl true
        buildConfig true
    }
    externalNativeBuild {
        cmake {
            path file('./src/main/cpp/CMakeLists.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    androidResources {
        cruncherEnabled false
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable "UnusedResources", 'RestrictedApi'
        textReport false
        checkOnly += ['NewApi', 'InlinedApi']
    }
}


tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}


dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation 'androidx.appcompat:appcompat:1.2.0'

    implementation 'me.weishu:free_reflection:3.0.1'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
    implementation "com.github.CodingGay.BlackReflection:core:$rootProject.ext.blackReflection"
    implementation project(':Bcore:black-fake')
    implementation project(':Bcore:black-binder')
    implementation project(':Bcore:black-hook')
    implementation project(':android-mirror')

    implementation project(':Bcore:pine-core')
    implementation project(':Bcore:pine-xposed')
    implementation project(':Bcore:pine-xposed-res')

    testImplementation 'junit:junit:4.13.2'
}
