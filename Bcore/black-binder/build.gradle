apply plugin: 'com.android.library'

def blackBoxBooleanOption = { String name, boolean defaultValue ->
    if (project.hasProperty(name)) {
        return project.property(name).toString().toBoolean()
    }
    if (rootProject.hasProperty(name)) {
        return rootProject.property(name).toString().toBoolean()
    }
    if (rootProject.ext.has(name)) {
        return rootProject.ext.get(name).toString().toBoolean()
    }
    return defaultValue
}

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        consumerProguardFiles 'consumer-rules.pro'
        buildConfigField "boolean", "BLACKBOX_DIAGNOSTIC_LOGCAT_ENABLED",
                "${blackBoxBooleanOption('blackboxDiagnosticLogcatEnabled', true)}"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable "UnusedResources", 'RestrictedApi'
        textOutput "stdout"
        textReport false
        check 'NewApi', 'InlinedApi'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly project(':Bcore:pine-core')
    testImplementation project(':Bcore:pine-core')
    testImplementation 'junit:junit:4.13.2'
}
