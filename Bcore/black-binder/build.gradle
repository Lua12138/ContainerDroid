apply plugin: 'com.android.library'

def blackBoxBooleanOption = { String name, boolean defaultValue ->
    if (project.hasProperty(name)) {
        return project.property(name).toString().toBoolean()
    }
    if (rootProject.hasProperty(name)) {
        return rootProject.property(name).toString().toBoolean()
    }
    if (rootProject.ext.has(name)) {
        return rootProject.ext.get(name).toString().toBoolean()
    }
    return defaultValue
}

android {
    namespace 'top.niunaijun.blackbox.binder'
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        minSdk 21
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        consumerProguardFiles 'consumer-rules.pro'
        buildConfigField "boolean", "BLACKBOX_DIAGNOSTIC_LOGCAT_ENABLED",
                "${blackBoxBooleanOption('blackboxDiagnosticLogcatEnabled', true)}"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable "UnusedResources", 'RestrictedApi'
        textReport false
        checkOnly += ['NewApi', 'InlinedApi']
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly project(':Bcore:pine-core')
    testImplementation project(':Bcore:pine-core')
    testImplementation 'junit:junit:4.13.2'
}
